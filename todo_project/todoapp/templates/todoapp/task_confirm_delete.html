{% extends "todoapp/base.html" %}
{% block title %}Удалить задачу{% endblock %}
{% block content %}
<h2>Удалить задачу: "{{ task.title }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить</button>
    <a href="{% url 'task_list' %}">Отмена</a>
</form>
{% endblock %}
